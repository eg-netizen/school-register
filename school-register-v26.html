// Renders the researched admissions detail (all 57 schools are populated).
// --- Prose-to-list helpers for the Admissions section (render-time only; the
// underlying data strings are unchanged). ---

// Split an allocation narrative into sentences for bullet rendering. Splits at
// sentence-ending punctuation followed by a capital/flag/paren/digit, then
// re-merges fragments that ended on a known abbreviation (e.g. 'i.e.') so
// they are never split mid-thought. Decimals ('0.965 mi') never match because
// the period is not followed by whitespace.
const ABBREV_END = /(?:\b(?:e\.g|i\.e|etc|vs|approx|cf|No)\.)$/;
function splitSentences(text) {
  const parts = text.split(/(?<=[.!?])\s+(?=[A-Z⚠(0-9])/);
  const out = [];
  parts.forEach((p) => {
    if (out.length && ABBREV_END.test(out[out.length - 1].trimEnd())) out[out.length - 1] += " " + p;
    else out.push(p);
  });
  return out.map((s) => s.trim()).filter(Boolean);
}

// Split a criteria string on its embedded rank markers — '(1)', '(2–5)', '(A)'
// — into { intro, items: [{ marker, body }], outro }. Sentences after the last
// item's first sentence become the outro (tie-breaks, flags, sources). Returns
// null if fewer than 2 markers are found, so the caller falls back to prose.
function splitCriteria(text) {
  const re = /\((\d+(?:\s*[–-]\s*\d+)?|[A-Z])\)\s+/g;
  const found = [];
  let m;
  while ((m = re.exec(text)) !== null) found.push({ marker: m[1], start: m.index, end: re.lastIndex });
  if (found.length < 2) return null;
  const intro = text.slice(0, found[0].start).trim();
  const items = found.map((f, i) => ({
    marker: f.marker,
    body: text.slice(f.end, i + 1 < found.length ? found[i + 1].start : text.length).trim(),
  }));
  // Peel trailing sentences off the final item into an outro.
  const lastSentences = splitSentences(items[items.length - 1].body);
  let outro = "";
  if (lastSentences.length > 1) {
    items[items.length - 1].body = lastSentences[0];
    outro = lastSentences.slice(1).join(" ");
  }
  return { intro, items, outro };
}

function SegmentedControl({ name, options, value, onChange, label, group, counts }) {
  const c = GROUP_COLORS[group] || GROUP_COLORS.sort;
  return (
    <fieldset className="border-0 p-0 m-0">
      <legend className="block uppercase tracking-wide font-mono" style={{ fontSize: 10, color: c.text, marginBottom: 2 }}>{label}</legend>
      <div className="inline-flex flex-wrap rounded-2xl gap-1" style={{ backgroundColor: c.track, padding: 4 }}>
        {options.map((opt) => {
          const id = `${name}-${opt}`.replace(/\s+/g, "-");
          const checked = value === opt;
          const count = counts ? counts[opt] : null;
          return (
            <span key={opt} className="relative">
              <input type="radio" id={id} name={name} value={opt} checked={checked} onChange={() => onChange(opt)} className="sr-only seg-input" />
              <label
                htmlFor={id}
                className="flex items-center justify-center rounded-full text-xs font-medium cursor-pointer select-none"
                style={{ minHeight: 44, padding: "0 12px", backgroundColor: checked ? c.active : "transparent", color: checked ? COLORS.white : c.text, boxShadow: checked ? "0 1px 2px rgba(0,0,0,0.15)" : "none" }}
              >
                {opt}
                {count != null && <span style={{ marginLeft: 4, opacity: 0.75 }}>({count})</span>}
              </label>
            </span>
          );
        })}
      </div>
    </fieldset>
  );
}

function ActiveFilterChip({ children, color, onRemove, removable }) {
  return (
    <span className="inline-flex items-center gap-1 text-xs font-mono rounded-full" style={{ backgroundColor: color, color: COLORS.white, padding: "3px 10px" }}>
      {children}
      {removable && (
        <button onClick={onRemove} className="rounded-full focus:outline-none" style={{ marginLeft: 2, padding: 2 }} aria-label={`Remove filter: ${children}`}>
          <X size={11} aria-hidden="true" />
        </button>
      )}
    </span>
  );
}

  { term: "Progress 8", color: COLORS.teal, def: "How much progress pupils made from end of primary school to GCSEs, compared with pupils nationally who started at a similar level. 0 = average progress; positive scores mean pupils progressed further than expected. Not nationally calculated for the 2024/25 or 2025/26 GCSE cohorts (a COVID-era gap in primary baseline data), so figures shown here are mostly from the 2023/24 cohort, the most recent year available." },
  { term: "Attainment 8", color: COLORS.plum, def: "The average GCSE grade across a pupil's best 8 qualifying subjects (English and maths count double), scored on a 1-9 scale per subject. Higher is better. Unlike Progress 8, this doesn't account for where pupils started." },
  { term: "% Grade 5+ in English & Maths", color: COLORS.rust, def: "The share of pupils achieving a grade 5 ('strong pass') or above in both GCSE English and Maths. The most commonly cited headline figure, but reflects intake as well as teaching quality." },
  { term: "Ofsted rating", def: "An inspector's overall judgement of the school. Since September 2024, Ofsted no longer issues a single overall word for most inspections — it publishes category-level report cards instead — so the date shown matters as much as the word itself." },
  { term: "Banding test type & shared sittings", def: "In compact view, each banding chip's second line shows a short code for the test type where known (NVR = non-verbal reasoning, GL = GL Assessment, CAT = cognitive ability test (provider/edition not named), CAT4 = GL's cognitive abilities test, VR+Num = verbal & numerical reasoning, GL×2 = GL two-round selective exam, WY6 = Wandsworth Year 6 Test (borough banding test), ? = test confirmed but provider not sourced). A white ring around the chip plus a small link icon means the test is a literal shared sitting — currently St Augustine's, Grey Coat Hospital, and St Marylebone all use the exact same test, so a child only needs to sit it once. This is different from full academic selection (see Henrietta Barnett, marked 'Selective'), which screens for the highest-attaining pupils rather than mixing ability." },
  { term: "Admissions Criteria section", def: "Shown in each school's expanded detail: the ranked oversubscription priority order for the September 2027 entry round, and how places were really allocated in the most recently completed cycle (e.g. last distance offered, applications per place). Special aptitude places (music, art, languages) appear as a short tag with fuller detail beneath. Each figure cites its source and year." },
  { term: "Faith fit verdict", color: "#2B5566", def: "A judgement made specifically for this family — a Russian Orthodox (Eastern Christian) girl living at NW8 8NY — not a general school rating. Banker (green) = an offer is highly likely (the school is undersubscribed, or her actual route reliably reaches her). Realistic (teal) = plausible but competitive. Reach (amber) = unlikely on current evidence (out of distance range, a selective exam, or a named faith rung that recent offers do not reach). Closed (red) = no viable route at all (e.g. a different faith's certificate is required, a CofE-only rung, or no Year 7 round). The guiding rule is 'named is not the same as reachable': a faith school naming an Eastern-Christian category only lifts the verdict where offers actually reach that category. Each card's expanded detail explains the reasoning and the route she would compete through; treat every verdict as provisional pending the March 2027 offer round." },
  { term: "Saved views & borough filter", def: "The three view buttons (Safe / banker, Realistic targets, Reach / selective) are one-tap presets: each clears the other filters, shows only schools with that faith-fit verdict, and picks a sensible sort (nearest-first for the first two, strongest results first for reach). The borough dropdown narrows to any one of the eleven boroughs in range. Both can be combined with the other filters." },

  { term: "Rank number (#)", def: "Sequential, based on the schools currently visible after your filters are applied — the top result reads 1, and the last reads however many schools are shown. Reversing the sort direction reverses which school is 1." },

function VersionHistory() {
  return (
    <details className="rounded-xl group" style={{ backgroundColor: COLORS.card, border: `2px solid ${COLORS.cardBorder}`, marginBottom: 16 }}>
      <summary className="font-serif-display text-base cursor-pointer select-none flex items-center justify-between focus:outline-none rounded-xl" style={{ color: COLORS.ink, padding: 16, minHeight: 44 }}>
        <span className="inline-flex items-center gap-2">
          <History size={16} aria-hidden="true" style={{ color: COLORS.meta }} />
          Version history
        </span>
        <ChevronDown size={18} aria-hidden="true" style={{ color: COLORS.meta }} className="transition-transform duration-200 motion-reduce:transition-none group-open:rotate-180" />
      </summary>
      <div style={{ padding: "0 16px 16px 16px" }} className="space-y-3">
        {[...VERSION_HISTORY].reverse().map((v) => (
          <div key={v.version} className="flex gap-3">
            <span className="font-mono shrink-0 rounded-full text-xs" style={{ backgroundColor: COLORS.cardBorder, color: COLORS.ink, padding: "2px 8px", height: "fit-content" }}>
              v{v.version}
            </span>
            <div>
              <div className="font-mono text-sm font-semibold" style={{ color: COLORS.ink }}>{v.label}</div>
              <div className="text-sm leading-relaxed mt-0.5" style={{ color: COLORS.meta }}>{v.summary}</div>
            </div>
          </div>
        ))}
      </div>
    </details>
  );
}

function Glossary() {
  return (
    <details className="rounded-xl group" style={{ backgroundColor: COLORS.card, border: `2px solid ${COLORS.cardBorder}`, marginBottom: 16 }}>
      <summary className="font-serif-display text-base cursor-pointer select-none flex items-center justify-between focus:outline-none rounded-xl" style={{ color: COLORS.ink, padding: 16, minHeight: 44 }}>
        <span>What do these terms mean?</span>
        <ChevronDown size={18} aria-hidden="true" style={{ color: COLORS.meta }} className="transition-transform duration-200 motion-reduce:transition-none group-open:rotate-180" />
      </summary>
      <dl style={{ padding: "0 16px 16px 16px" }} className="space-y-4">
        {GLOSSARY.map((g) => (
          <div key={g.term}>
            <dt className="font-mono text-sm font-semibold flex items-center gap-2" style={{ color: COLORS.ink }}>
              {g.color && <span className="inline-block rounded-full" style={{ width: 10, height: 10, backgroundColor: g.color }} aria-hidden="true" />}
              {g.term}
            </dt>
            <dd className="text-sm leading-relaxed mt-1" style={{ color: COLORS.ink }}>{g.def}</dd>
          </div>
        ))}
      </dl>
    </details>
  );
}

// Always-visible key for the four faith-fit verdicts. The same colours drive
// each card's left spine and its Faith-fit chip, so the meaning is legible
// at a glance without opening the glossary.
function VerdictLegend() {
  return (
    <div className="flex flex-wrap items-center gap-x-3 gap-y-1.5 rounded-lg px-3 py-2" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.divider}`, marginBottom: 12 }} aria-label="Faith-fit verdict key">
      <span className="font-mono uppercase tracking-wide" style={{ fontSize: 10, color: COLORS.meta }}>Faith fit (card spine):</span>
      {["banker", "realistic", "reach", "closed"].map((k) => {
        const m = FAITH_FIT[k];
        return (
          <span key={k} className="inline-flex items-center gap-1.5" title={m.blurb} style={{ fontSize: 11, color: COLORS.ink }}>
            <span aria-hidden="true" style={{ width: 14, height: 14, borderRadius: 4, backgroundColor: m.color, border: `1px solid rgba(0,0,0,0.15)`, display: "inline-block", flexShrink: 0 }} />
            {m.label}
          </span>
        );
      })}
    </div>
  );
}

// localStorage. Every read/write is wrapped in try/catch and every stored value
// is validated against its option list, so blocked storage or stale values fall
// back silently to DEFAULTS. Search text and the compare tray are not saved.
const PREFS_KEY = "school-register-prefs-v1";
function loadPrefs() {
  const out = { ...DEFAULTS };
  try {
    const raw = window.localStorage.getItem(PREFS_KEY);
    if (!raw) return out;
    const saved = JSON.parse(raw);
    const allowed = {
      sortBy: SORTS.map((x) => x.id),
      direction: ["asc", "desc"],
      typeFilter: TYPE_FILTERS,
      bandingFilter: BANDING_FILTERS,
      faithFilter: FAITH_FILTERS,

      boroughFilter: BOROUGHS,
      viewMode: VIEW_MODES,
      unit: UNIT_OPTIONS,

function getSortValue(school, sortBy) {
  if (sortBy === "distance") return school.distance;
  if (sortBy === "ofsted") return OFSTED_RANK[school.ofsted] ?? null;
  return school[sortBy];
}

function sortSchools(list, sortBy, direction) {
  return [...list].sort((a, b) => {
    const av = getSortValue(a, sortBy);
    const bv = getSortValue(b, sortBy);
    const aMissing = av == null;
    const bMissing = bv == null;
    if (aMissing && bMissing) return a.distance - b.distance;
    if (aMissing) return 1;
    if (bMissing) return -1;
    const diff = direction === "asc" ? av - bv : bv - av;
    if (diff !== 0) return diff;
    return a.distance - b.distance;
  });
}

            <ActiveFilterChip color={GROUP_COLORS.sort.active}>{sortLabel} {direction === "asc" ? "↑" : "↓"}</ActiveFilterChip>
            {query.trim() !== "" && (
              <ActiveFilterChip color={COLORS.navy} removable onRemove={() => setQuery("")}>Search: {query.trim()}</ActiveFilterChip>
            )}
            {faithFitFilter !== DEFAULTS.faithFitFilter && (
              <ActiveFilterChip color={GROUP_COLORS.fit.active} removable onRemove={() => setFaithFitFilter(DEFAULTS.faithFitFilter)}>Fit: {faithFitFilter}</ActiveFilterChip>
            )}
            {faithFilter !== DEFAULTS.faithFilter && (
              <ActiveFilterChip color={GROUP_COLORS.faith.active} removable onRemove={() => setFaithFilter(DEFAULTS.faithFilter)}>{faithFilter}</ActiveFilterChip>
            )}
            {typeFilter !== DEFAULTS.typeFilter && (
              <ActiveFilterChip color={GROUP_COLORS.intake.active} removable onRemove={() => setTypeFilter(DEFAULTS.typeFilter)}>{typeFilter} only</ActiveFilterChip>
            )}
            {boroughFilter !== DEFAULTS.boroughFilter && (
              <ActiveFilterChip color={COLORS.navy} removable onRemove={() => setBoroughFilter(DEFAULTS.boroughFilter)}>{boroughFilter}</ActiveFilterChip>
            )}
            {bandingFilter !== DEFAULTS.bandingFilter && (
              <ActiveFilterChip color={GROUP_COLORS.banding.active} removable onRemove={() => setBandingFilter(DEFAULTS.bandingFilter)}>Banding: {bandingFilter}</ActiveFilterChip>
            )}
            {!isDefault && (
              <button onClick={resetAll} className="inline-flex items-center gap-1 text-xs font-mono rounded-full focus:outline-none" style={{ border: `2px solid ${COLORS.cardBorder}`, color: COLORS.ink, padding: "3px 10px", minHeight: 44, marginLeft: "auto" }}>
                <RotateCcw size={12} aria-hidden="true" />
                Reset
              </button>
            )}
          </div>
        </div>

        {sortBy !== "distance" && (
          <p className="font-mono text-xs px-1" style={{ color: COLORS.meta, marginBottom: 8 }}>
            Schools with no figure for this measure are listed last, in either direction. Rank numbers are sequential
            within the current view (1 = top result shown).
          </p>
        )}

        <KeyDatesPanel />
        <Glossary />
        <VersionHistory />

        <h2 id="results" className="sr-only">Results</h2>
        <p className="font-mono px-1 text-sm" style={{ color: COLORS.ink, marginBottom: 12 }} aria-live="polite">
          Showing {filtered.length} of {SCHOOLS.length} schools
        </p>

        <VerdictLegend />

        <div className={viewMode === "Compact" ? "space-y-2" : "space-y-3"}>
          {filtered.map((school, i) => (
            <SchoolCard key={school.id} school={school} rank={i + 1} activeSortMetric={activeSortMetric} compact={viewMode === "Compact"} unit={unit} inCompare={compareIds.includes(school.id)} compareFull={compareIds.length >= COMPARE_MAX} onToggleCompare={toggleCompare} />
          ))}
        </div>

        {filtered.length === 0 && (
          <div className="text-center py-12" style={{ color: COLORS.meta }}>
            <p className="font-serif-display text-lg mb-1" style={{ color: COLORS.ink }}>No schools match these filters</p>
            <p className="text-sm">Try clearing the search, or widening the faith-fit verdict, borough, intake, faith, or banding filter above.</p>
          </div>
        )}

        <div style={{ marginTop: 32, paddingTop: 16, borderTop: `2px solid ${COLORS.cardBorder}`, fontSize: 12, color: COLORS.ink, lineHeight: 1.6 }} className="px-1">
          <p>
            Distances are straight-line from NW8 8NY's geocoded centroid, recomputed precisely for the 54 established schools using per-school GIAS geocodes (the last four Block B postcode-centroid distances were tightened to official GIAS grid references in v2.15); the three Block E Wandsworth additions currently use approximate street geocodes, flagged to tighten to GIAS grid references.
            Researched against DfE performance data, Ofsted reports, and individual admissions policies — no figures
            are estimated; a blank means it genuinely wasn't found. Admissions Criteria are populated for all 54
            schools, each citing its source and year. The Henrietta Barnett School uses full academic selection (a
            two-round entrance exam), not banding, and is flagged distinctly. See the glossary above for what each
            measure means.
          </p>
          <p style={{ marginTop: 10 }}>
            The <strong>Faith fit</strong> verdict on each card is judged specifically for this family — a Russian
            Orthodox (Eastern Christian) girl at NW8 8NY — not a general rating. It weighs whether her actual route
            (a named faith rung, distance, banding, ballot or a selective exam) has recently reached her: a named
            Eastern-Christian category only counts as a Banker or Realistic target where offers actually reach it,
            or the school is undersubscribed. Verify each verdict against the school's own determined arrangements
            and the March 2027 offer round before relying on it.
          </p>
        </div>

        {compareIds.length > 0 && <div aria-hidden="true" style={{ height: compareOpen ? 8 : 64 }} />}
      </main>

      <div className="sr-only" aria-live="polite" role="status">
        {compareIds.length === 0
          ? "Compare tray empty."
          : `${compareIds.length} school${compareIds.length === 1 ? "" : "s"} in compare tray${compareIds.length >= COMPARE_MAX ? " (tray full)" : ""}.`}
      </div>

      <CompareTray ids={compareIds} onClear={() => { setCompareIds([]); setCompareOpen(false); }} onRemove={toggleCompare} open={compareOpen} setOpen={setCompareOpen} unit={unit} />
    </div>
  );
}
